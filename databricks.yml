bundle:
  name: veloradar

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this environment
  source_path:
    description: Landing volume path where the raw JSONL event files arrive

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: veloradar_dev
      source_path: /Volumes/veloradar_dev/landing/events/

  stage:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: veloradar_stage
      source_path: /Volumes/veloradar_stage/landing/events/

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: veloradar_prod
      source_path: /Volumes/veloradar_prod/landing/events/
